# Cloudflare Workers settings for the weather relay (see relay/worker.js and the README).
# Deploy from the project folder:  npx wrangler deploy --config relay/wrangler.toml
name = "daily-weather-relay"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Pages allowed to use the relay (comma-separated).
ALLOWED_ORIGINS = "https://jakelau1.github.io"

# Logging off: Cloudflare turns Workers Logs on by default for new Workers (observability.enabled defaults to true).
# false stops it keeping a record of requests. Per Cloudflare's Wrangler configuration reference.
[observability]
enabled = false
