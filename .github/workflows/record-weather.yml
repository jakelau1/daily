# Runs on GitHub's servers every 10 minutes (GitHub may run these late or skip some), and whenever you push a change.
# 1. Saves the latest Hong Kong Observatory readings into weather/data/history.json (for the past 12 hours),
#    plus copies of the hourly forecast and air-quality feeds.
#    Also saves the 2-hour rain nowcast for Happy Valley (weather/data/nowcast.json) for the "now" display.
# 2. Publishes the site (only the public folders, see "Assemble the site") to GitHub Pages. Scheduled runs only
#    publish when the data changed; pushes and "Run workflow" always publish.
# Step 2 is needed because GitHub does not rebuild Pages for commits made by an Action.
# REQUIRES: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Record weather and publish

on:
  schedule:
    - cron: '6-56/10 * * * *' # every 10 minutes at :06, :16 … :56, away from the busy start of the hour
  push:
    branches: [main]           # change "main" if your branch has a different name
  workflow_dispatch:           # lets you press "Run workflow" by hand in the Actions tab

permissions:
  contents: write              # save the data files back into the repository
  pages: write                 # publish to GitHub Pages
  id-token: write              # required by the Pages publishing step

concurrency:
  group: record-weather
  cancel-in-progress: false

jobs:
  record-and-publish:
    runs-on: ubuntu-26.04        # named version, so GitHub moving 'ubuntu-latest' doesn't change it unannounced
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WEATHER_DIR: weather     # the folder holding the weather page; the recorder writes its data/ subfolder
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main              # start from the newest version, including data saved by the previous run
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch data
        run: node scripts/record-weather.mjs
      - name: Save data in the repository (keeps history between runs)
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$WEATHER_DIR/data"
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Update weather data"
          cp -r "$WEATHER_DIR/data" /tmp/this-run-data   # this run's own copy, in case the pull below damages a file
          git pull --rebase -X theirs   # if two runs overlap, keep this run's newer data
          # Safeguard: every data file must still be valid JSON after combining with another run.
          # If one isn't, put back this run's complete copy (the other run's readings in that
          # file are lost, but the file stays readable). Backups named *.damaged-* are skipped.
          for f in "$WEATHER_DIR"/data/*.json; do
            case "$f" in *.damaged-*) continue ;; esac
            if ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"; then
              b="/tmp/this-run-data/$(basename "$f")"
              if [ -f "$b" ]; then
                echo "::warning file=$f::$f was damaged while combining runs; keeping this run's copy"
                cp "$b" "$f"
                git add "$f"
                git commit -m "Repair $(basename "$f") after combining runs"
              else
                echo "::warning file=$f::$f is not valid JSON and this run has no copy of it to put back"
              fi
            fi
          done
          git push
      - name: Assemble the site (public folders only; leaves out scripts, tools, partials and .github)
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir _site
          cp -r index.html 404.html .nojekyll assets weather hiking arrivals cams trips savings study now _site/
      - uses: actions/configure-pages@v6
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v5
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site
      - name: Publish
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v5
