<!--
  PRIVACY LOCK. This Content-Security-Policy tells the browser to refuse every
  network request except to these servers:
    'self'                 - this site: the page's own code, styles, logo and trail data
    mapapi.geodata.gov.hk  - Lands Department map tiles and place-name labels
    portal.csdi.gov.hk     - live trail closures (AFCD, via the CSDI Portal)
  Images may also be 'data:' (built into the page, no request): Leaflet uses one to
  cancel tile downloads it no longer needs.
  All code and styles must come from files on this site; code written inside the
  page itself is refused. No fonts, images, scripts or analytics from anywhere else.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://mapapi.geodata.gov.hk; connect-src 'self' https://portal.csdi.gov.hk; base-uri 'none'; form-action 'none'">
